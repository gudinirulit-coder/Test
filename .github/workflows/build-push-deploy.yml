# Сборка образа → GHCR, затем по SSH: pull и запуск на сервере.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY — доступ по SSH
#   GHCR_USER, GHCR_TOKEN — для docker login на сервере, если образ в GHCR приватный
#     (classic PAT: read:packages; для публичного образа секреты можно не задавать — блок login пропустится)
#
# Нестандартный SSH: в шаге appleboy/ssh-action добавьте with.port (см. комментарий внизу файла).
#
# Пуш в GHCR из Actions: встроенный GITHUB_TOKEN (permissions: packages: write ниже).

name: Build, push to GHCR, deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Docker build & push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.full }}

    steps:
      - uses: actions/checkout@v4

      - name: Имя образа для GHCR (нижний регистр)
        id: image
        run: |
          lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "full=ghcr.io/${lower}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.full }}

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Pull & run on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # port: 2222  # при необходимости: нестандартный SSH-порт
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USER:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker pull "$IMAGE"
            docker stop time-api 2>/dev/null || true
            docker rm time-api 2>/dev/null || true
            docker run -d --name time-api --restart unless-stopped -p 8000:8000 "$IMAGE"
